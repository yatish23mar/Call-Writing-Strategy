name: EOD Naked Short Screener

on:
  schedule:
    # Runs at 15:25 UTC (8:55 PM IST) Monday through Friday
    - cron: '25 15 * * 1-5'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Quant Dependencies
        run: |
          python -m pip install --upgrade pip
          # Includes yfinance instead of tvdatafeed
          pip install pandas numpy yfinance requests py_vollib
          # Bypasses the PyPI version conflict by installing from GitHub main branch
          pip install git+https://github.com/twopirllc/pandas-ta.git@main

      - name: Execute Screener and Send Alert
        env:
          # Ensure these secrets are correctly mapped in your GitHub Settings -> Secrets -> Actions
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python screener.py
